name: Build APK from ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Không thấy file .zip trong repo. Hãy upload GodlyMovieReview-phase1.zip vào thư mục gốc."
            exit 1
          fi
          echo "Dùng: $ZIP"
          rm -rf work && mkdir work
          unzip -q "$ZIP" -d work
          SETTINGS=$(find work -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Trong zip không có settings.gradle.kts"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Kiểm tra cấu trúc dự án
        run: |
          cd "$PROJECT_DIR"
          python3 scripts/verify_project.py

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Kiểm tra APK
        run: |
          cd "$PROJECT_DIR"
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -n 15
          unzip -l "$APK" | grep "assets/model_manifest.json"
          if unzip -l "$APK" | grep -Ei '\.(gguf|onnx)$|ggml'; then
            echo "APK không được chứa model"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodlyMovieReview-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit test
        run: |
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest --stacktrace

      - name: Upload báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
